name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          install: false
          runtime: node@24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run types
      - run: pnpm run generate
      - run: git diff --exit-code
      - name: 既存マイグレーションの変更を検出
        run: >
          ./scripts/check-migrations.sh "${{ github.event.pull_request.base.sha || github.event.before }}"
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run storybook:build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          install: false
          runtime: node@24
      - run: pnpm install --frozen-lockfile
      - run: ./e2e/run.sh
