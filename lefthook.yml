pre-commit:
  parallel: true
  jobs:
    - name: fix
      run: pnpm fix
      stage_fixed: true
    - name: typecheck
      run: pnpm typecheck
    - name: doctor
      # React のフレームワーク判定を効かせるため apps/web で実行する
      root: apps/web
      run: pnpm exec react-doctor --staged --blocking warning
pre-push:
  jobs:
    - name: knip
      run: pnpm knip
